{{ define "main" }}
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  <span class="icon-moon">{{- with resources.Get "svg/moon.svg" }}{{ .Content | safeHTML }}{{ end -}}</span>
  <span class="icon-sun">{{- with resources.Get "svg/sun.svg" }}{{ .Content | safeHTML }}{{ end -}}</span>
</button>
<main class="app">
  <div class="container">
    <nav class="post-nav"><a href="/">← Back</a></nav>
    <article class="post">
      <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ with .Date }}<time class="post-date" datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2, 2006" }}</time>{{ end }}
      </header>
      <div class="post-content prose">
        {{ .Content }}
      </div>
    </article>
  </div>
</main>
{{ end }}
